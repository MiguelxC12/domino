<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>Dominó Cubano</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
<section id="home" class="screen active">
  <button id="adminBtn" class="admin-corner">⚙ Admin</button>
  <div class="hero"><div class="brand">DOMINÓ <span>CUBANO</span></div><p>4 jugadores · 2 equipos · primero a 100</p></div>
  <div class="card login-card">
    <label>Tu nombre</label><input id="name" maxlength="18" placeholder="Ej. Miguel" autocomplete="nickname">
    <div class="actions"><button id="create" class="primary">Crear sala</button><button id="toggleJoin" class="secondary">Unirse</button></div>
    <div id="joinBox" class="hidden"><label>Código de sala</label><input id="code" maxlength="5" placeholder="ABCDE"><button id="join" class="primary wide">Entrar</button></div>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="top"><button id="back">←</button><b>SALA <span id="lcode"></span></b><button id="copy">Compartir</button></div>
  <div class="card"><h2>Jugadores <span id="count"></span></h2><div id="players"></div></div>
  <div class="card"><h2>Configuración</h2>
    <div class="setting-title">Modo</div><div class="variants"><button data-mode="team">👥 Equipos<br><small>parejas</small></button><button data-mode="individual">🧑 Individual<br><small>cada jugador por sí mismo</small></button></div>
    <div class="setting-title">Fichas</div><div class="variants"><button data-v="6">Doble-6<br><small>7 fichas</small></button><button data-v="9">Doble-9<br><small>10 fichas</small></button></div>
    <button id="start" class="primary wide">Comenzar partida</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="top game-top"><div><small>SALA <span id="gcode"></span></small><b id="turn"></b></div><div class="top-actions"><button id="landscape" title="Horizontal">⛶</button><button id="sound">🔊</button><button id="gameAdmin">⚙</button></div></div>
  <div id="score" class="score"></div>
  <div id="seats" class="seats"></div>
  <div id="starterBanner" class="banner hidden"></div>
  <div class="table-wrap"><div id="board" class="board"></div><span id="empty">La mesa está vacía</span></div>
  <div class="handtitle">Tu mano <small id="hc"></small></div>
  <div id="hand" class="hand"></div>
</section>

<div id="sideModal" class="modal hidden"><div class="modalcard choice-card"><h2>¿Dónde quieres ponerla?</h2><p>La ficha coincide en los dos extremos.</p><div id="sideChoices" class="side-choices"></div><button id="cancelChoice" class="secondary wide">Cancelar</button></div></div>
<div id="modal" class="modal hidden"><div class="modalcard"><div id="icon">🏆</div><h2 id="mtitle"></h2><p id="mtext"></p><b id="mscore"></b><button id="next" class="primary wide">Siguiente mano</button><button id="again" class="secondary wide hidden">Nueva partida</button></div></div>
<div id="adminModal" class="modal hidden"><div class="modalcard admin-card"><div class="admin-head"><h2>Administrador</h2><button id="closeAdmin">✕</button></div><div id="adminLogin"><p>Introduce la contraseña de administrador.</p><input id="adminPassword" type="password" inputmode="numeric"><button id="adminLoginBtn" class="primary wide">Entrar</button></div><div id="adminPanel" class="hidden"><div id="adminRooms"></div></div></div></div>
<div id="toast"></div>
</main>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
