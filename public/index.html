<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Dominó Cubano Online</title><link rel="stylesheet" href="/styles.css"></head><body><main>
<section id="home" class="screen active"><div class="hero"><div class="brand">DOMINÓ <span>EYACULATIS</span></div><p>4 jugadores · 2 equipos · primero a 100</p></div><div class="card"><label>Tu nombre</label><input id="name" maxlength="18" placeholder="Ej. Miguel"><div class="actions"><button id="create" class="primary">Crear sala</button><button id="toggleJoin" class="secondary">Unirse</button></div><div id="joinBox" class="hidden"><label>Código</label><input id="code" maxlength="5" placeholder="ABCDE"><button id="join" class="primary wide">Entrar</button></div></div></section>
<section id="lobby" class="screen"><div class="top"><button id="back">←</button><b>SALA <span id="lcode"></span></b><button id="copy">Copiar</button></div><div class="card"><h2>Jugadores <span id="count"></span></h2><div id="players"></div></div><div class="card"><h2>Configuración</h2><div class="variants"><button data-v="6">Doble-6<br><small>7 fichas</small></button><button data-v="9">Doble-9<br><small>10 fichas</small></button></div><button id="start" class="primary wide">Comenzar</button></div></section>
<section id="game" class="screen"><div class="top"><div><small>SALA <span id="gcode"></span></small><b id="turn"></b></div><button id="sound">🔊</button></div><div class="score"><div>Equipo A <b id="s0">0</b></div><span>VS</span><div>Equipo B <b id="s1">0</b></div></div><div id="around" class="around"></div><div class="table"><div id="board"></div><span id="empty">La mesa está vacía</span></div><div id="banner" class="banner hidden"></div><div class="handtitle">Tu mano <small id="hc"></small></div><div id="hand" class="hand"></div></section>
<div id="modal" class="modal hidden"><div class="modalcard"><div id="icon">🏆</div><h2 id="mtitle"></h2><p id="mtext"></p><b id="mscore"></b><button id="next" class="primary wide">Siguiente mano</button><button id="again" class="secondary wide hidden">Nueva partida</button></div></div><div id="toast"></div></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
